<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartIGLab - Connexion</title>
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ANIMATED BACKGROUND */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
      background-size: 50px 50px;
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
      animation: bgMove 20s linear infinite;
    }

    @keyframes bgMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    /* CONTAINER */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: slideIn 0.6s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* CARD */
    .login-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(30px) saturate(180%);
      border-radius: 30px;
      padding: 50px 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    /* LOGO */
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-icon {
      font-size: 4em;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2.2em;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #fff, #a8edea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 1em;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    /* FORM */
    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 0.9em;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .password-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      color: #fff;
      font-size: 1em;
      font-family: inherit;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .password-wrapper input {
      padding-right: 50px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      outline: none;
      border-color: #4CD964;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(76, 217, 100, 0.3);
    }

    /* PASSWORD TOGGLE */
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 2;
      fill: none;
      transition: stroke 0.2s ease;
    }

    .toggle-password:hover svg {
      stroke: rgba(255, 255, 255, 0.9);
    }

    .toggle-password.active svg {
      stroke: #4CD964;
    }

    /* BUTTON */
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #4CD964, #3AB54A);
      border: none;
      border-radius: 15px;
      color: #fff;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(76, 217, 100, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76, 217, 100, 0.6);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      background: rgba(255, 255, 255, 0.2);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ERROR MESSAGE */
    .error-message {
      background: rgba(255, 59, 48, 0.2);
      border: 2px solid #FF3B30;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
      color: #FF3B30;
      font-weight: 600;
      display: none;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .error-message.show {
      display: block;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85em;
      opacity: 0.7;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .login-card {
        padding: 40px 30px;
      }
      
      h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <h1>SmartIGLab</h1>
        <div class="subtitle">Connexion au Dashboard</div>
      </div>
      
      <div class="error-message" id="errorMessage">⚠️ Identifiants invalides</div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Entrez votre nom d'utilisateur" 
            required 
            autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Entrez votre mot de passe" 
              required 
              autocomplete="current-password">
            <button 
              type="button" 
              class="toggle-password" 
              id="togglePassword" 
              aria-label="Afficher le mot de passe">
              <svg id="eyeIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn-login">Se connecter</button>
      </form>
      
      <div class="footer">🔒 Connexion sécurisée</div>
    </div>
  </div>

  <script>
    function initPasswordToggle() {
      const toggleButton = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (!toggleButton || !passwordInput || !eyeIcon) return;
      
      toggleButton.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          toggleButton.classList.add('active');
          eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" y1="2" x2="22" y2="22"/>`;
        } else {
          passwordInput.type = 'password';
          toggleButton.classList.remove('active');
          eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>`;
        }
      });
    }

    function initLoginForm() {
      const form = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      const loginButton = document.querySelector('.btn-login');
      
      if (!form) return;
      
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (errorMessage) {
          errorMessage.classList.remove('show');
        }
        
        loginButton.disabled = true;
        loginButton.textContent = 'Connexion en cours...';
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
            credentials: 'include'
          });
          
          if (response.ok) {
            window.location.href = '/';
          } else {
            const errorText = await response.text();
            showError(errorMessage, errorText || 'Nom d\'utilisateur ou mot de passe incorrect');
            loginButton.disabled = false;
            loginButton.textContent = 'Se connecter';
          }
        } catch (error) {
          showError(errorMessage, 'Erreur de connexion. Vérifiez votre connexion réseau.');
          loginButton.disabled = false;
          loginButton.textContent = 'Se connecter';
        }
      });
    }

    function showError(errorElement, message) {
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.classList.add('show');
      }
    }

    async function checkSession() {
      try {
        const response = await fetch('/status', { credentials: 'include' });
        if (response.ok) {
          window.location.href = '/';
        }
      } catch (error) {
        console.log('No existing session');
      }
    }

    function initInputEnhancements() {
      const inputs = document.querySelectorAll('input');
      
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          const errorMessage = document.getElementById('errorMessage');
          if (errorMessage) {
            errorMessage.classList.remove('show');
          }
        });
        
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            const form = document.getElementById('loginForm');
            if (form) {
              form.dispatchEvent(new Event('submit'));
            }
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkSession();
      initPasswordToggle();
      initLoginForm();
      initInputEnhancements();
      
      const usernameInput = document.getElementById('username');
      if (usernameInput) {
        usernameInput.focus();
      }
    });
  </script>
</body>
</html>
