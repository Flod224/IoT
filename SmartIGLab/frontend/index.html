<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>SmartIGLab - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,#1e3c72 0%,#2a5298 50%,#7e22ce 100%);
  min-height:100vh;
  padding:20px;
  color:#fff;
  position:relative;
  overflow-x:hidden
}
body::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
  background-size:50px 50px;
  opacity:0.3;
  z-index:0;
  pointer-events:none
}
.container{
  max-width:1400px;
  margin:0 auto;
  position:relative;
  z-index:1
}
header{
  text-align:center;
  margin-bottom:40px;
  animation:fadeInDown 0.8s ease
}
h1{
  font-size:3em;
  font-weight:700;
  text-shadow:2px 2px 20px rgba(0,0,0,0.3);
  margin-bottom:10px;
  background:linear-gradient(45deg,#fff,#a8edea);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text
}
.subtitle{
  font-size:1.2em;
  opacity:0.9;
  text-shadow:1px 1px 10px rgba(0,0,0,0.3)
}
.current-time{
  font-size:1.5em;
  font-weight:600;
  margin-top:15px;
  padding:12px 30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:20px;
  display:inline-block;
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 4px 15px rgba(0,0,0,0.2)
}
#status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 24px;
  border-radius:25px;
  font-weight:600;
  font-size:1em;
  margin:20px auto;
  backdrop-filter:blur(10px);
  transition:all 0.3s ease;
  animation:pulse 2s infinite
}
#status.ok{
  background:rgba(76,217,100,0.2);
  border:2px solid #4CD964;
  color:#4CD964;
  box-shadow:0 4px 15px rgba(76,217,100,0.4)
}
#status.error{
  background:rgba(255,59,48,0.2);
  border:2px solid #FF3B30;
  color:#FF3B30;
  box-shadow:0 4px 15px rgba(255,59,48,0.4)
}
#status.loading{
  background:rgba(0,122,255,0.2);
  border:2px solid #007AFF;
  color:#007AFF
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  margin-top:30px
}
.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px) saturate(180%);
  border-radius:20px;
  padding:30px;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
  transition:all 0.3s ease;
  animation:fadeInUp 0.6s ease backwards
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 40px rgba(0,0,0,0.3);
  border-color:rgba(255,255,255,0.4)
}
.card-icon{
  font-size:2.5em;
  margin-bottom:15px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3))
}
.card h2{
  font-size:1.1em;
  font-weight:600;
  opacity:0.9;
  margin-bottom:15px;
  text-transform:uppercase;
  letter-spacing:1px
}
.value{
  font-size:2.8em;
  font-weight:700;
  line-height:1;
  margin:15px 0;
  text-shadow:2px 2px 10px rgba(0,0,0,0.3)
}
.unit{
  font-size:0.5em;
  opacity:0.7;
  font-weight:400;
  margin-left:5px
}
.course-hero{
  background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));
  backdrop-filter:blur(30px);
  border-radius:30px;
  padding:60px 40px;
  text-align:center;
  border:2px solid rgba(255,255,255,0.3);
  box-shadow:0 15px 50px rgba(0,0,0,0.3);
  animation:scaleIn 0.6s ease
}
.course-icon{
  font-size:5em;
  margin-bottom:20px;
  animation:bounce 2s infinite
}
.course-title{
  font-size:3em;
  font-weight:700;
  margin:20px 0;
  line-height:1.2;
  text-shadow:2px 2px 15px rgba(0,0,0,0.3)
}
.course-time{
  font-size:1.8em;
  opacity:0.95;
  margin:15px 0;
  font-weight:500
}
.course-professor{
  font-size:1.5em;
  opacity:0.85;
  margin:10px 0;
  font-style:italic
}
.course-status{
  display:inline-block;
  margin-top:30px;
  padding:20px 40px;
  background:rgba(255,59,48,0.3);
  border:2px solid #FF3B30;
  border-radius:50px;
  font-size:1.4em;
  font-weight:700;
  color:#FF3B30;
  box-shadow:0 6px 20px rgba(255,59,48,0.4);
  animation:pulse 2s infinite
}
.free-status{
  grid-column:1/-1;
  background:linear-gradient(135deg,rgba(76,217,100,0.2),rgba(76,217,100,0.1));
  border:2px solid #4CD964;
  text-align:center;
  padding:40px;
  font-size:2.5em;
  font-weight:700;
  color:#4CD964;
  animation:scaleIn 0.6s ease
}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.loading-text{
  text-align:center;
  font-size:1.5em;
  opacity:0.8;
  animation:pulse 1.5s infinite
}
.logout-btn{
  position:fixed;
  top:20px;
  right:20px;
  padding:12px 24px;
  background:rgba(255,59,48,0.2);
  border:2px solid #FF3B30;
  border-radius:20px;
  color:#FF3B30;
  font-weight:600;
  font-size:0.95em;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:all 0.3s ease;
  box-shadow:0 4px 15px rgba(255,59,48,0.3);
  z-index:1000
}
.logout-btn:hover{
  background:rgba(255,59,48,0.3);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(255,59,48,0.5)
}
.logout-btn:active{
  transform:translateY(0)
}
@media(max-width:768px){
  h1{font-size:2em}
  .course-title{font-size:2em}
  .course-time{font-size:1.3em}
  .value{font-size:2em}
  .logout-btn{
    top:10px;
    right:10px;
    padding:10px 18px;
    font-size:0.85em
  }
}
</style>
</head>
<body>
<button class='logout-btn' onclick='logout()'>Déconnexion</button>
<div class='container'>
<header>
<h1>🎓 SmartIGLab</h1>
<div class='subtitle'>Auditoire Intelligent</div>
<div class='current-time' id='currentTime'> --:--</div>
<div id='status' class='loading'> Connexion en cours...</div>
</header>
<div id='content' class='loading-text'>Chargement des données...</div>
</div>
<script>
let cachedData=null;
let currentMode=null;
let isFirstLoad=true;

async function logout(){
if(confirm('Voulez-vous vraiment vous déconnecter ?')){
try{
const response=await fetch('/logout',{method:'POST'});
if(response.ok){
window.location.href='/login';
}
}catch(e){
console.error('Erreur logout:',e);
window.location.href='/login';
}
}
}

function updateClock(){
const now=new Date();
const h=String(now.getHours()).padStart(2,'0');
const m=String(now.getMinutes()).padStart(2,'0');
document.getElementById('currentTime').textContent=` ${h}:${m}`;
}
function updateData(){
fetch('/status')
.then(r=>{
if(!r.ok)throw new Error('API error');
return r.json();
})
.then(data=>{
if(!data||typeof data!=='object'||data.error){
document.getElementById('status').className='error';
document.getElementById('status').innerHTML='<span>⚠️</span> Erreur système';
if(isFirstLoad){
document.getElementById('content').innerHTML='<div class="grid"><div class="free-status">🟢 SALLE LIBRE</div></div>';
isFirstLoad=false;
}
return;
}
document.getElementById('status').className='ok';
document.getElementById('status').innerHTML='<span>✓</span> Système opérationnel';
const newMode=data.hyperplanning&&data.hyperplanning.state==='course_en_cours'?'course':'free';
if(isFirstLoad||currentMode!==newMode){
renderFullPage(data,newMode);
currentMode=newMode;
isFirstLoad=false;
}else{
updateValues(data);
}
cachedData=data;
})
.catch(e=>{
document.getElementById('status').className='error';
document.getElementById('status').innerHTML='<span>✗</span> Erreur de connexion';
if(isFirstLoad){
document.getElementById('content').innerHTML='<div class="card"><div class="card-icon">⚠️</div><h2>Service indisponible</h2><p>Vérifiez la connexion réseau</p></div>';
}
});
}
function renderFullPage(data,mode){
let html='';
if(mode==='course'){
html=`<div class="course-hero">
<div class="course-icon">📚</div>
<div class="course-title" id="courseTitle">${data.hyperplanning.title||'Cours en cours'}</div>
<div class="course-time" id="courseTime"> ${data.hyperplanning.start_time} - ${data.hyperplanning.end_time}</div>`;
if(data.hyperplanning.professor)html+=`<div class="course-professor" id="courseProf"> ${data.hyperplanning.professor}</div>`;
html+=`<div class="course-status">🔴 SALLE OCCUPÉE</div>
</div><div class="grid" style="margin-top:30px">`;
if(data.environment&&data.environment.temperature!==null){
html+=`<div class="card" style="animation-delay:0.1s">
<div class="card-icon">🌡️</div>
<h2>Température</h2>
<div class="value" id="tempValue">${data.environment.temperature.toFixed(1)}<span class="unit">°C</span></div>
</div>`;
}
if(data.environment&&data.environment.humidity!==null){
html+=`<div class="card" style="animation-delay:0.2s">
<div class="card-icon">💧</div>
<h2>Humidité</h2>
<div class="value" id="humValue">${data.environment.humidity.toFixed(1)}<span class="unit">%</span></div>
</div>`;
}
html+='</div>';
}else{
html='<div class="grid"><div class="free-status">🟢 SALLE LIBRE</div>';
if(data.people_count!==undefined&&data.capacity){
html+=`<div class="card" style="animation-delay:0.1s">
<div class="card-icon">👥</div>
<h2>Occupants</h2>
<div class="value" id="peopleValue">${data.people_count}<span class="unit">/ ${data.capacity}</span></div>
</div>`;
}
if(data.environment&&data.environment.window_open!==null){
html+=`<div class="card" style="animation-delay:0.2s">
<div class="card-icon" id="windowIcon">${data.environment.window_open?'🪟':'🚪'}</div>
<h2>Fenêtre</h2>
<div class="value" id="windowValue">${data.environment.window_open?'Ouverte':'Fermée'}</div>
</div>`;
}
if(data.environment&&data.environment.temperature!==null){
html+=`<div class="card" style="animation-delay:0.3s">
<div class="card-icon">🌡️</div>
<h2>Température</h2>
<div class="value" id="tempValue">${data.environment.temperature.toFixed(1)}<span class="unit">°C</span></div>
</div>`;
}
if(data.environment&&data.environment.humidity!==null){
html+=`<div class="card" style="animation-delay:0.4s">
<div class="card-icon">💧</div>
<h2>Humidité</h2>
<div class="value" id="humValue">${data.environment.humidity.toFixed(1)}<span class="unit">%</span></div>
</div>`;
}
html+='</div>';
}
document.getElementById('content').innerHTML=html;
}
function updateValues(data){
if(currentMode==='course'){
const title=document.getElementById('courseTitle');
if(title&&data.hyperplanning.title)title.textContent=data.hyperplanning.title;
const time=document.getElementById('courseTime');
if(time)time.textContent=` ${data.hyperplanning.start_time} - ${data.hyperplanning.end_time}`;
}else{
const people=document.getElementById('peopleValue');
if(people&&data.people_count!==undefined)people.innerHTML=`${data.people_count}<span class="unit">/ ${data.capacity}</span>`;
const windowIcon=document.getElementById('windowIcon');
const windowVal=document.getElementById('windowValue');
if(windowIcon&&windowVal&&data.environment&&data.environment.window_open!==null){
windowIcon.textContent=data.environment.window_open?'🪟':'🚪';
windowVal.textContent=data.environment.window_open?'Ouverte':'Fermée';
}
}
const temp=document.getElementById('tempValue');
if(temp&&data.environment&&data.environment.temperature!==null)temp.innerHTML=`${data.environment.temperature.toFixed(1)}<span class="unit">°C</span>`;
const hum=document.getElementById('humValue');
if(hum&&data.environment&&data.environment.humidity!==null)hum.innerHTML=`${data.environment.humidity.toFixed(1)}<span class="unit">%</span>`;
}
updateClock();
setInterval(updateClock,60000);
updateData();
setInterval(updateData,5000);
</script>
</body>
</html>
